<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ремонтная Мастерская</title>
    <!-- Bootstrap CSS for adaptive UI -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Ремонтная Мастерская</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    {% if user %}
                        <li class="nav-item"><span class="nav-link text-light">Привет, {{ user.full_name }} ({{ user.role.value }})</span></li>
                        <li class="nav-item"><a class="nav-link" href="/logout">Выйти</a></li>
                    {% else %}
                        <li class="nav-item"><a class="nav-link" href="/login">Войти</a></li>
                        <li class="nav-item"><a class="nav-link" href="/register">Регистрация</a></li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
